# Model configurations for classical baselines & foundation models

random_seed: 42

models:
  random_walk:
    type: "naive"
    window: 24

  historical_mean:
    type: "mean"
    window: 168

  har_rv:
    type: "ols_newey_west"
    windows: [24, 168, 720]
    hac_lags: 24

  garch:
    p: 1
    q: 1
    dist: "t" # Student-t innovations
    mean: "Constant"
    vol: "GARCH"

  gjr_garch:
    p: 1
    o: 1 # Asymmetry term
    q: 1
    dist: "t"
    mean: "Constant"
    vol: "GJR-GARCH"

  lightgbm:
    objective: "regression"
    boosting_type: "gbdt"
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 6
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 20
    random_state: 42
    n_jobs: -1

  foundation_tesseract:
    package: "kumo_forecast"
    huggingface_repo: "nvidia/Kumo-Forecast"
    seq_len: 512
    forecast_horizon: 24
    darr_mode: true
    modes:
      - "zero_shot"
      - "head_finetune"
      - "backbone_finetune"
    finetune:
      epochs_head: 5
      epochs_backbone: 3
      learning_rate_head: 1e-4
      learning_rate_backbone: 1e-5
      batch_size: 32

  anomaly_tesseract:
    package: "kumo_anomaly"
    huggingface_repo: "nvidia/Kumo-Anomaly"
    threshold_strategy: "scs" # or "macs"
    nsample: 15
